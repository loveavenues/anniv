<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Padlock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    
    .font-display {
      font-family: 'Playfair Display', Georgia, serif;
    }
    
    .heart-padlock {
      filter: drop-shadow(0 20px 40px rgba(190, 24, 93, 0.3));
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .heart-padlock:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 25px 50px rgba(190, 24, 93, 0.4));
    }
    
    .shackle {
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: bottom right;
    }
    
    .unlocked .shackle {
      transform: translateY(-25px) translateX(10px) rotate(-35deg);
    }
    
    .keyhole {
      transition: all 0.3s ease;
    }
    
    .heart-padlock:hover .keyhole {
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
    }
    
    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: sparkle 2s infinite;
    }
    
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }
    
    .sparkle:nth-child(1) { top: 20%; left: 15%; animation-delay: 0s; }
    .sparkle:nth-child(2) { top: 30%; right: 20%; animation-delay: 0.5s; }
    .sparkle:nth-child(3) { top: 60%; left: 25%; animation-delay: 1s; }
    .sparkle:nth-child(4) { top: 50%; right: 15%; animation-delay: 1.5s; }
    
    .pulse-ring {
      position: absolute;
      inset: -20px;
      border: 2px solid rgba(244, 114, 182, 0.3);
      border-radius: 50%;
      animation: pulse-ring 2s infinite;
    }
    
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    
    .floating {
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .message-reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease 0.3s;
    }
    
    .unlocked .message-reveal {
      opacity: 1;
      transform: translateY(0);
    }
    
    .bg-pattern {
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(244, 114, 182, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(251, 207, 232, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(190, 24, 93, 0.05) 0%, transparent 30%);
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full m-0 overflow-auto">
  <div id="app-container" class="w-full min-h-full bg-pattern flex flex-col items-center justify-center p-4 sm:p-8" style="background-color: #fdf2f8;"><!-- Decorative Elements -->
   <div class="hidden sm:block absolute top-10 left-10 text-4xl opacity-20 floating" style="animation-delay: 0.2s;">
    💕
   </div>
   <div class="hidden sm:block absolute top-20 right-16 text-3xl opacity-20 floating" style="animation-delay: 0.8s;">
    💗
   </div>
   <div class="hidden sm:block absolute bottom-20 left-20 text-2xl opacity-20 floating" style="animation-delay: 1.2s;">
    💖
   </div>
   <div class="hidden sm:block absolute bottom-16 right-10 text-3xl opacity-20 floating" style="animation-delay: 0.5s;">
    💝
   </div>
   <div id="padlock-container" class="relative cursor-pointer select-none"><!-- Pulse Ring -->
    <div class="pulse-ring"></div><!-- Sparkles -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div><!-- Heart Padlock SVG -->
    <svg class="heart-padlock w-48 h-60 sm:w-64 sm:h-80 md:w-72 md:h-96" viewbox="0 0 200 260" fill="none" xmlns="http://www.w3.org/2000/svg"><!-- Shackle (the curved part at top) --> <g class="shackle">
      <path d="M60 80 C60 40, 100 25, 100 25 C100 25, 140 40, 140 80 L140 100 L130 100 L130 80 C130 50, 100 40, 100 40 C100 40, 70 50, 70 80 L70 100 L60 100 Z" fill="url(#goldGradient)" stroke="url(#goldStroke)" stroke-width="2" /> <!-- Shackle shine -->
      <path d="M68 80 C68 55, 100 45, 100 45" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" fill="none" />
     </g> <!-- Heart Body --> <path d="M100 230 C100 230, 30 170, 30 120 C30 85, 60 70, 100 100 C140 70, 170 85, 170 120 C170 170, 100 230, 100 230 Z" fill="url(#heartGradient)" stroke="url(#heartStroke)" stroke-width="3" /> <!-- Heart Shine --> <path d="M55 110 Q70 90, 85 105" stroke="rgba(255,255,255,0.5)" stroke-width="8" stroke-linecap="round" fill="none" /> <!-- Keyhole --> <g class="keyhole">
      <circle cx="100" cy="145" r="12" fill="#1a1a2e" />
      <path d="M94 150 L106 150 L103 180 L97 180 Z" fill="#1a1a2e" /> <!-- Keyhole inner glow -->
      <circle cx="100" cy="145" r="8" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
     </g> <!-- Lock plate decoration --> <ellipse cx="100" cy="125" rx="25" ry="8" fill="url(#plateGradient)" opacity="0.6" /> <!-- Gradients --> <defs>
      <lineargradient id="heartGradient" x1="30" y1="70" x2="170" y2="230">
       <stop offset="0%" stop-color="#f472b6" />
       <stop offset="50%" stop-color="#ec4899" />
       <stop offset="100%" stop-color="#be185d" />
      </lineargradient>
      <lineargradient id="heartStroke" x1="30" y1="70" x2="170" y2="230">
       <stop offset="0%" stop-color="#fda4af" />
       <stop offset="100%" stop-color="#9d174d" />
      </lineargradient>
      <lineargradient id="goldGradient" x1="60" y1="25" x2="140" y2="100">
       <stop offset="0%" stop-color="#fcd34d" />
       <stop offset="50%" stop-color="#f59e0b" />
       <stop offset="100%" stop-color="#d97706" />
      </lineargradient>
      <lineargradient id="goldStroke" x1="60" y1="25" x2="140" y2="100">
       <stop offset="0%" stop-color="#fef3c7" />
       <stop offset="100%" stop-color="#92400e" />
      </lineargradient>
      <lineargradient id="plateGradient" x1="75" y1="117" x2="125" y2="133">
       <stop offset="0%" stop-color="#fda4af" />
       <stop offset="100%" stop-color="#fb7185" />
      </lineargradient>
     </defs>
    </svg>
   </div><!-- Status Text -->
   <div class="mt-4 sm:mt-8 text-center px-4">
    <p id="status-text" class="font-display text-xl sm:text-2xl md:text-3xl font-semibold" style="color: #be185d;">Our first kiss was on?</p>
    <p id="instruction-text" class="mt-2 text-xs sm:text-sm" style="color: #ec4899;">Enter passcode to unlock</p>
   </div><!-- Passcode Input -->
   <div id="passcode-panel" class="mt-4 sm:mt-6 flex flex-col items-center gap-3 sm:gap-4">
    <div class="flex gap-2 sm:gap-4" id="passcode-display"><!-- Digit 1 -->
     <div class="flex flex-col items-center gap-1"><button class="arrow-up w-8 h-7 sm:w-10 sm:h-8 rounded-lg transition-all hover:scale-110 active:scale-95 flex items-center justify-center text-white font-bold text-lg sm:text-xl" style="background: linear-gradient(135deg, #ec4899, #be185d);" data-index="0">▲</button> <input type="text" maxlength="1" class="w-10 h-12 sm:w-12 sm:h-14 text-center text-xl sm:text-2xl font-bold rounded-lg border-2 focus:outline-none transition-all" style="border-color: #f472b6; color: #be185d;" readonly value="0" data-index="0"> <button class="arrow-down w-8 h-7 sm:w-10 sm:h-8 rounded-lg transition-all hover:scale-110 active:scale-95 flex items-center justify-center text-white font-bold text-lg sm:text-xl" style="background: linear-gradient(135deg, #ec4899, #be185d);" data-index="0">▼</button>
     </div><!-- Digit 2 -->
     <div class="flex flex-col items-center gap-1"><button class="arrow-up w-8 h-7 sm:w-10 sm:h-8 rounded-lg transition-all hover:scale-110 active:scale-95 flex items-center justify-center text-white font-bold text-lg sm:text-xl" style="background: linear-gradient(135deg, #ec4899, #be185d);" data-index="1">▲</button> <input type="text" maxlength="1" class="w-10 h-12 sm:w-12 sm:h-14 text-center text-xl sm:text-2xl font-bold rounded-lg border-2 focus:outline-none transition-all" style="border-color: #f472b6; color: #be185d;" readonly value="0" data-index="1"> <button class="arrow-down w-8 h-7 sm:w-10 sm:h-8 rounded-lg transition-all hover:scale-110 active:scale-95 flex items-center justify-center text-white font-bold text-lg sm:text-xl" style="background: linear-gradient(135deg, #ec4899, #be185d);" data-index="1">▼</button>
     </div><!-- Digit 3 -->
     <div class="flex flex-col items-center gap-1"><button class="arrow-up w-8 h-7 sm:w-10 sm:h-8 rounded-lg transition-all hover:scale-110 active:scale-95 flex items-center justify-center text-white font-bold text-lg sm:text-xl" style="background: linear-gradient(135deg, #ec4899, #be185d);" data-index="2">▲</button> <input type="text" maxlength="1" class="w-10 h-12 sm:w-12 sm:h-14 text-center text-xl sm:text-2xl font-bold rounded-lg border-2 focus:outline-none transition-all" style="border-color: #f472b6; color: #be185d;" readonly value="0" data-index="2"> <button class="arrow-down w-8 h-7 sm:w-10 sm:h-8 rounded-lg transition-all hover:scale-110 active:scale-95 flex items-center justify-center text-white font-bold text-lg sm:text-xl" style="background: linear-gradient(135deg, #ec4899, #be185d);" data-index="2">▼</button>
     </div><!-- Digit 4 -->
     <div class="flex flex-col items-center gap-1"><button class="arrow-up w-8 h-7 sm:w-10 sm:h-8 rounded-lg transition-all hover:scale-110 active:scale-95 flex items-center justify-center text-white font-bold text-lg sm:text-xl" style="background: linear-gradient(135deg, #ec4899, #be185d);" data-index="3">▲</button> <input type="text" maxlength="1" class="w-10 h-12 sm:w-12 sm:h-14 text-center text-xl sm:text-2xl font-bold rounded-lg border-2 focus:outline-none transition-all" style="border-color: #f472b6; color: #be185d;" readonly value="0" data-index="3"> <button class="arrow-down w-8 h-7 sm:w-10 sm:h-8 rounded-lg transition-all hover:scale-110 active:scale-95 flex items-center justify-center text-white font-bold text-lg sm:text-xl" style="background: linear-gradient(135deg, #ec4899, #be185d);" data-index="3">▼</button>
     </div>
    </div><!-- Check Button --> <button id="check-btn" class="mt-2 px-8 py-2.5 sm:px-10 sm:py-3 rounded-full font-display font-semibold text-sm sm:text-base text-white transition-all duration-300 hover:scale-105 hover:shadow-lg active:scale-95" style="background: linear-gradient(135deg, #ec4899, #be185d);"> Check Code </button>
    <p id="error-message" class="text-xs sm:text-sm font-semibold mt-2 opacity-0 transition-opacity" style="color: #be185d;">Incorrect passcode</p>
   </div><!-- Message (shown when unlocked) -->
   <div id="message-container" class="message-reveal mt-4 sm:mt-6 text-center max-w-md px-4">
    <p id="main-message" class="font-display text-lg sm:text-xl md:text-2xl italic" style="color: #9d174d;">Forever yours 💕</p>
   </div><!-- Lock/Unlock Button --> <button id="toggle-btn" class="mt-4 sm:mt-6 px-6 py-2.5 sm:px-8 sm:py-3 rounded-full font-display font-semibold text-sm sm:text-base text-white transition-all duration-300 hover:scale-105 hover:shadow-lg active:scale-95 opacity-0 pointer-events-none" style="background: linear-gradient(135deg, #ec4899, #be185d);"> Lock My Heart </button>
  </div>
  <script>
    const defaultConfig = {
      main_message: "Our first kiss was on?",
      passcode: "2201",
      primary_color: "#fdf2f8",
      accent_color: "#be185d",
      text_color: "#9d174d",
      button_color: "#ec4899",
      highlight_color: "#f472b6"
    };

    let digits = [0, 0, 0, 0];

    async function onConfigChange(config) {
      const message = config.main_message || defaultConfig.main_message;
      const primaryColor = config.primary_color || defaultConfig.primary_color;
      const accentColor = config.accent_color || defaultConfig.accent_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const buttonColor = config.button_color || defaultConfig.button_color;
      
      document.getElementById('main-message').textContent = message;
      document.getElementById('app-container').style.backgroundColor = primaryColor;
      document.getElementById('status-text').style.color = accentColor;
      document.getElementById('instruction-text').style.color = buttonColor;
      document.getElementById('main-message').style.color = textColor;
      document.getElementById('toggle-btn').style.background = `linear-gradient(135deg, ${buttonColor}, ${accentColor})`;
      document.getElementById('check-btn').style.background = `linear-gradient(135deg, ${buttonColor}, ${accentColor})`;
      
      const passcodeInputs = document.querySelectorAll('#passcode-display input');
      passcodeInputs.forEach(input => {
        input.style.borderColor = config.highlight_color || defaultConfig.highlight_color;
        input.style.color = accentColor;
      });
      
      const arrowBtns = document.querySelectorAll('.arrow-up, .arrow-down');
      arrowBtns.forEach(btn => {
        btn.style.background = `linear-gradient(135deg, ${buttonColor}, ${accentColor})`;
      });
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.primary_color || defaultConfig.primary_color,
            set: (value) => { config.primary_color = value; window.elementSdk.setConfig({ primary_color: value }); }
          },
          {
            get: () => config.accent_color || defaultConfig.accent_color,
            set: (value) => { config.accent_color = value; window.elementSdk.setConfig({ accent_color: value }); }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => { config.text_color = value; window.elementSdk.setConfig({ text_color: value }); }
          },
          {
            get: () => config.button_color || defaultConfig.button_color,
            set: (value) => { config.button_color = value; window.elementSdk.setConfig({ button_color: value }); }
          },
          {
            get: () => config.highlight_color || defaultConfig.highlight_color,
            set: (value) => { config.highlight_color = value; window.elementSdk.setConfig({ highlight_color: value }); }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || 'Playfair Display',
          set: (value) => { config.font_family = value; window.elementSdk.setConfig({ font_family: value }); }
        },
        fontSizeable: {
          get: () => config.font_size || 24,
          set: (value) => { config.font_size = value; window.elementSdk.setConfig({ font_size: value }); }
        }
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ["main_message", config.main_message || defaultConfig.main_message],
        ["passcode", config.passcode || defaultConfig.passcode]
      ]);
    }

    function updatePasscodeDisplay() {
      const inputs = document.querySelectorAll('#passcode-display input');
      inputs.forEach((input, index) => {
        input.value = digits[index];
      });
    }
    
    function showError() {
      const errorMsg = document.getElementById('error-message');
      errorMsg.style.opacity = '1';
      
      const inputs = document.querySelectorAll('#passcode-display input');
      inputs.forEach(input => {
        input.style.borderColor = '#be185d';
        input.style.animation = 'shake 0.5s';
      });
      
      setTimeout(() => {
        errorMsg.style.opacity = '0';
        inputs.forEach(input => {
          input.style.animation = '';
          input.style.borderColor = '#f472b6';
        });
      }, 2000);
    }
    
    function checkPasscode() {
      const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
      const correctPasscode = (config.passcode || defaultConfig.passcode).slice(0, 4);
      const enteredPasscode = digits.join('');
      
      if (enteredPasscode === correctPasscode) {
        window.location.href = "main.html"; // <-- redirect when correct
      } else {
        showError();
      }
    }

    // Event listeners for arrow buttons
    document.querySelectorAll('.arrow-up').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const index = parseInt(btn.dataset.index);
        digits[index] = (digits[index] + 1) % 10;
        updatePasscodeDisplay();
      });
    });
    
    document.querySelectorAll('.arrow-down').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const index = parseInt(btn.dataset.index);
        digits[index] = (digits[index] - 1 + 10) % 10;
        updatePasscodeDisplay();
      });
    });
    
    document.getElementById('check-btn').addEventListener('click', checkPasscode);
    
    // Add shake animation style
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
      }
    `;
    document.head.appendChild(style);

    // Initialize SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>
 </body>
</html>
