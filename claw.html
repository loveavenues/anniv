<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kawaii Claw Machine</title>
<style>
    :root{
        --bg1:#ffe4f2;
        --bg2:#fff1ff;
        --pink:#ff6fa1;
        --pink2:#ffb3d9;
        --blue:#b3e5fc;
        --yellow:#fff7a8;
        --purple:#d1b3ff;
        --dark:#2f1b2b;
        --soft:#ffe6f7;
        --shadow: rgba(255, 111, 161, 0.25);
    }

    body{
        margin:0;
        padding:0;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        font-family: 'Poppins', 'Segoe UI', 'Roboto', sans-serif;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        overflow-x:hidden;
    }

    .machine-container{
        background: linear-gradient(145deg, #fff7ff, #ffe6f7);
        border-radius: 22px;
        padding: 18px;
        box-shadow: 0 25px 50px var(--shadow);
        border: 10px solid #fff;
        position: relative;
        width: 100%;
        max-width: 600px;
        height: 800px;
        display:flex;
        flex-direction:column;
    }

    .machine-container::before{
        content:'';
        position:absolute;
        top:-12px; left:-12px; right:-12px; bottom:-12px;
        background: linear-gradient(45deg, #fff, var(--pink2), #ff8fb5);
        border-radius: 35px;
        z-index:-1;
        opacity:0.5;
    }

    .machine-top{
        background: linear-gradient(145deg, #ffd4e8, #ffb3d9);
        border-radius: 16px 16px 0 0;
        padding: 22px;
        margin-bottom: 14px;
        text-align:center;
        border: 4px solid #fff;
        position:relative;
        overflow:hidden;
        flex-shrink:0;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .machine-title{
        color: var(--dark);
        font-size: 2.2rem;
        font-weight: 800;
        margin:0;
        letter-spacing: 1px;
        text-shadow: 1px 1px 0 #fff;
    }

    .game-area{
        position: relative;
        width: calc(100% - 40px);
        height: 400px;
        background: linear-gradient(to bottom, #fff, #ffe6f7);
        border: 10px solid #fff;
        border-radius: 16px;
        overflow:hidden;
        margin: 20px;
        flex-shrink:0;
        box-shadow: inset 0 4px 8px rgba(0,0,0,0.05);
    }

    .glass-reflection{
        position:absolute;
        top:0; left:0; right:0; bottom:0;
        background:
          linear-gradient(135deg, rgba(255,255,255,0.55) 0%, transparent 30%),
          radial-gradient(circle at 20% 20%, rgba(255,255,255,0.5) 0%, transparent 50%);
        border-radius: 16px;
        pointer-events:none;
        z-index:100;
    }

    .sparkles{
        position:absolute;
        top:0; left:0; right:0; bottom:0;
        pointer-events:none;
        background-image:
            radial-gradient(2px 2px at 20px 30px, #fff, transparent),
            radial-gradient(2px 2px at 40px 70px, var(--pink2), transparent),
            radial-gradient(1px 1px at 90px 40px, #fff, transparent),
            radial-gradient(1px 1px at 130px 80px, var(--pink), transparent),
            radial-gradient(2px 2px at 160px 30px, #fff, transparent);
        background-repeat: repeat;
        background-size: 200px 100px;
        animation: sparkle 3s linear infinite;
    }

    @keyframes sparkle{
        0%,100%{ opacity:1; }
        50%{ opacity:0.3; }
    }

    .claw-track{
        position:absolute;
        top:0;
        left:0;
        right:0;
        height:25px;
        background: linear-gradient(to right, var(--pink2), var(--pink), var(--blue));
        border-bottom: 3px solid #fff;
        border-radius: 15px 15px 0 0;
    }

    .claw-container{
        position:absolute;
        top:0;
        left:250px;
        transition: all 0.3s ease;
        z-index:10;
    }

    .claw-motor{
        position:absolute;
        top:-12px;
        left:50%;
        transform: translateX(-50%);
        width:30px;
        height:12px;
        background: linear-gradient(145deg, #ffb3d9, #ff6fa1);
        border-radius: 10px;
        border: 2px solid #fff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .claw-cable{
        width:3px;
        height:120px;
        background: linear-gradient(to bottom, #ff6fa1, #ffb3d9);
        margin:0 auto;
        position:relative;
        border-radius:2px;
        box-shadow: inset 1px 0 2px rgba(255,255,255,0.5);
    }

    .claw{
        position:absolute;
        bottom:-30px;
        left:50%;
        transform: translateX(-50%);
        width:50px;
        height:30px;
    }

    .claw.grabbing .claw-left{
        transform: rotate(-25deg);
    }
    .claw.grabbing .claw-right{
        transform: rotate(25deg);
    }

    .prize{
        position:absolute;
        width:45px;
        height:45px;
        border-radius:50%;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:1.8rem;
        cursor:pointer;
        transition: all 0.3s ease;
        border: 4px solid #fff;
        box-shadow: 0 6px 12px rgba(255,182,193,0.4);
    }

    .prize:hover{
        transform: scale(1.1) rotate(5deg);
    }

    .prize.grabbed{
        z-index:5;
    }

    .controls{
        margin: 15px 0 0 0;
        text-align:center;
        background: linear-gradient(145deg, #ffe6f7, #ffd4e8);
        padding: 18px;
        border-radius: 0 0 16px 16px;
        border: 4px solid #fff;
        border-top: 8px solid var(--pink);
        box-shadow: inset 0 4px 8px rgba(0,0,0,0.05);
        flex-shrink:0;
    }

    .control-row{
        display:flex;
        justify-content:center;
        align-items:center;
        gap:20px;
    }

    .control-btn{
        background: #fff;
        border: 1px solid #ccc;
        padding: 10px 18px;
        margin: 4px;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: bold;
        color: var(--dark);
        cursor:pointer;
        transition: all 0.2s ease;
    }

    .control-btn:hover{
        background:#f5f5f5;
    }

    .instructions{
        color: var(--dark);
        text-align:center;
        margin: 15px 0 10px 0;
        font-size: 0.9rem;
        background: linear-gradient(145deg, #fff, #ffd4e8);
        padding: 12px;
        border-radius: 8px;
        border: 2px solid #ff6fa1;
        box-shadow: inset 0 2px 4px rgba(255,182,193,0.2);
    }

    .prize-collection{
        position:absolute;
        bottom: 15px;
        left: 15px;
        right: 15px;
        height: 65px;
        background: linear-gradient(145deg, #fff, #ffe6f7);
        border-radius: 20px;
        display:flex;
        align-items:center;
        padding: 0 15px;
        overflow-x:auto;
        border: 3px solid #ff6fa1;
        box-shadow: inset 0 2px 10px rgba(255,182,193,0.3);
    }

    .collected-prize{
        width: 60px;
        height: 60px;
        border-radius: 50%;
        margin-right: 12px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:2rem;
        border: 3px solid #fff;
        flex-shrink:0;
        background: linear-gradient(145deg, var(--pink2), var(--pink));
        box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        animation: bounce 0.6s ease-in-out;
    }

    .collected-prize:hover{
        transform: scale(1.2) rotate(10deg);
    }

    @keyframes bounce{
        0% { transform: scale(0) rotate(0deg); }
        50% { transform: scale(1.3) rotate(180deg); }
        100% { transform: scale(1) rotate(360deg); }
    }

    .message-popup{
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: linear-gradient(145deg, #fff, #ffeef8);
        border: 6px solid #ff6fa1;
        border-radius: 25px;
        padding: 30px;
        max-width: 90vw;
        width: 400px;
        text-align:center;
        box-shadow: 0 25px 50px rgba(255,105,180,0.4);
        z-index:1000;
        animation: popIn 0.6s ease-out;
    }

    .message-text{
        font-size: 1.3rem;
        color: var(--dark);
        margin-bottom:20px;
        line-height:1.6;
    }

    .close-btn{
        background: linear-gradient(145deg, #ffb3d9, #ff6fa1);
        border: 3px solid #fff;
        padding: 12px 30px;
        border-radius: 20px;
        font-size: 1.1rem;
        font-weight:bold;
        color: var(--dark);
        cursor:pointer;
        transition: all 0.3s ease;
    }

    .overlay{
        position: fixed;
        top:0; left:0;
        width:100%; height:100%;
        background: rgba(255, 111, 161, 0.25);
        backdrop-filter: blur(5px);
        z-index:999;
    }

    .hidden{ display:none; }

    .back-btn-container{
        text-align:center;
        margin:15px 0;
    }

    .back-btn{
        background: linear-gradient(145deg, #ffb3d9, #ff6fa1);
        border: 2px solid #fff;
        padding: 12px 30px;
        border-radius: 20px;
        font-size:1.1rem;
        font-weight:bold;
        color: var(--dark);
        text-decoration:none;
        transition: all 0.3s ease;
    }

    .back-btn:hover{
        transform: translateY(-2px) scale(1.05);
    }
</style>
</head>
<body>
<div class="machine-container">
    <div class="machine-top">
        <h1 class="machine-title">LOVE LETTER MACHINE</h1>
    </div>

    <div class="game-area">
        <div class="glass-reflection"></div>
        <div class="sparkles"></div>
        <div class="claw-track"></div>

        <div class="claw-container" id="clawContainer">
            <div class="claw-motor"></div>
            <div class="claw-cable"></div>
            <div class="claw" id="claw">
                <svg viewBox="0 0 50 30" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="clawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ffb3d9;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ff69b4;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <circle cx="25" cy="8" r="6" fill="url(#clawGradient)" stroke="#fff" stroke-width="2"/>
                    <path class="claw-left" d="M19 8 L15 25 Q15 28 18 28 Q21 28 21 25 L25 8"
                          fill="url(#clawGradient)" stroke="#fff" stroke-width="2"
                          style="transform-origin: 25px 8px; transition: transform 0.3s ease;"/>
                    <path class="claw-right" d="M31 8 L35 25 Q35 28 32 28 Q29 28 29 25 L25 8"
                          fill="url(#clawGradient)" stroke="#fff" stroke-width="2"
                          style="transform-origin: 25px 8px; transition: transform 0.3s ease;"/>
                    <circle cx="23" cy="6" r="1" fill="#fff"/>
                    <circle cx="27" cy="6" r="1" fill="#fff"/>
                    <path d="M22 10 Q25 12 28 10" stroke="#fff" stroke-width="1" fill="none"/>
                </svg>
            </div>
        </div>

        <div class="prize envelope" data-message="Cuando sonríes mi mundo se ilumina" style="background: linear-gradient(145deg, #ffb3d9, #ff69b4); bottom: 100px; left: 10%;">💌</div>
        <div class="prize envelope" data-message="Cuando me abrazas me siento segura" style="background: linear-gradient(145deg, #b3e5fc, #81d4fa); bottom: 140px; left: 25%;">💌</div>
        <div class="prize envelope" data-message="Tus besos son la cura ante todo" style="background: linear-gradient(145deg, #fff9c4, #fff176); bottom: 110px; left: 45%;">💌</div>
        <div class="prize envelope" data-message="Te veo y me enamoro más" style="background: linear-gradient(145deg, #e1bee7, #ce93d8); bottom: 130px; left: 65%;">💌</div>
        <div class="prize envelope" data-message="Me encanta escucharte tocar la guitarra" style="background: linear-gradient(145deg, #ffcc80, #ffb74d); bottom: 105px; left: 80%;">💌</div>
        <div class="prize envelope" data-message="Siempre estás en mi mente " style="background: linear-gradient(145deg, #f8bbd9, #f48fb1); bottom: 150px; left: 15%;">💌</div>

        <div class="prize-collection" id="prizeCollection"></div>
    </div>

    <div class="controls">
        <div class="control-row">
            <button class="control-btn" onclick="moveClaw('left')">LEFT</button>
            <button class="control-btn" onclick="grabPrize()">GRAB</button>
            <button class="control-btn" onclick="moveClaw('right')">RIGHT</button>
        </div>
    </div>

    <div class="instructions">
        <small>✨ Keyboard: Left/Right arrows to move, Spacebar to grab messages ✨</small>
    </div>

    <div class="back-btn-container">
        <a href="main.html" class="back-btn">⬅ Back</a>
    </div>
</div>

<div class="overlay hidden" id="overlay"></div>
<div class="message-popup hidden" id="messagePopup">
    <div class="message-text" id="messageText"></div>
    <button class="close-btn" onclick="closeMessage()">💖 Close Message 💖</button>
</div>

<script>
    let clawPosition = { x: 0, y: 0 };
    let isGrabbing = false;
    let grabbedPrize = null;

    const clawContainer = document.getElementById('clawContainer');
    const claw = document.getElementById('claw');
    const prizeCollection = document.getElementById('prizeCollection');

    function moveClaw(direction){
        if(isGrabbing) return;

        const step = 30;
        const gameArea = document.querySelector('.game-area');
        const maxX = gameArea.offsetWidth - 50;

        if(direction === 'left' && clawPosition.x > step){
            clawPosition.x -= step;
        }
        if(direction === 'right' && clawPosition.x < maxX - step){
            clawPosition.x += step;
        }

        clawContainer.style.left = clawPosition.x + 'px';
        clawContainer.style.top = clawPosition.y + 'px';
    }

    function grabPrize(){
        if(isGrabbing) return;
        isGrabbing = true;

        const originalY = clawPosition.y;
        const gameArea = document.querySelector('.game-area');
        const dropY = gameArea.offsetHeight - 180;

        clawPosition.y = dropY;
        clawContainer.style.top = clawPosition.y + 'px';
        clawContainer.style.transition = 'all 0.8s ease-in';

        setTimeout(()=>{
            claw.classList.add('grabbing');

            const prizes = document.querySelectorAll('.prize:not(.grabbed)');
            let caughtPrize = null;

            prizes.forEach(prize => {
                const prizeRect = prize.getBoundingClientRect();
                const clawRect = claw.getBoundingClientRect();

                const distance = Math.sqrt(
                    Math.pow(prizeRect.left - clawRect.left, 2) +
                    Math.pow(prizeRect.top - clawRect.top, 2)
                );

                if(distance < 70){
                    caughtPrize = prize;
                }
            });

            if(caughtPrize){
                caughtPrize.classList.add('grabbed');
                grabbedPrize = caughtPrize;

                caughtPrize.style.left = (clawPosition.x + 10) + 'px';
                caughtPrize.style.top = (clawPosition.y + 100) + 'px';
                caughtPrize.style.transition = 'all 0.8s ease-out';
            }

            setTimeout(()=>{
                clawPosition.y = originalY;
                clawContainer.style.top = clawPosition.y + 'px';
                clawContainer.style.transition = 'all 0.8s ease-out';

                if(caughtPrize){
                    caughtPrize.style.top = (clawPosition.y + 100) + 'px';
                }

                setTimeout(()=>{
                    if(caughtPrize){
                        movePrizeToCollection(caughtPrize);
                    } else {
                        resetClaw();
                    }
                }, 800);
            }, 600);
        }, 800);
    }

    function movePrizeToCollection(prize){
        const message = prize.getAttribute('data-message');

        showMessage(message);

        const collectedPrize = document.createElement('div');
        collectedPrize.className = 'collected-prize';
        collectedPrize.style.background = prize.style.background;
        collectedPrize.textContent = prize.textContent;
        collectedPrize.setAttribute('data-message', message);
        collectedPrize.onclick = function(){
            showMessage(message);
        };
        prizeCollection.appendChild(collectedPrize);

        prize.remove();
        setTimeout(()=> resetClaw(), 500);
    }

    function showMessage(message){
        const messagePopup = document.getElementById('messagePopup');
        const messageText = document.getElementById('messageText');
        const overlay = document.getElementById('overlay');

        messageText.textContent = message;
        messagePopup.classList.remove('hidden');
        overlay.classList.remove('hidden');
    }

    function closeMessage(){
        document.getElementById('messagePopup').classList.add('hidden');
        document.getElementById('overlay').classList.add('hidden');
    }

    function resetClaw(){
        isGrabbing = false;
        grabbedPrize = null;
        claw.classList.remove('grabbing');
        clawContainer.style.transition = 'all 0.3s ease';

        const gameArea = document.querySelector('.game-area');
        const centerX = (gameArea.offsetWidth / 2) - 25;
        clawPosition = { x: centerX, y: 0 };
        clawContainer.style.left = clawPosition.x + 'px';
        clawContainer.style.top = clawPosition.y + 'px';
    }

    document.addEventListener('keydown', (e)=>{
        switch(e.key){
            case 'ArrowLeft':
                e.preventDefault();
                moveClaw('left');
                break;
            case 'ArrowRight':
                e.preventDefault();
                moveClaw('right');
                break;
            case ' ':
                e.preventDefault();
                grabPrize();
                break;
        }
    });

    window.addEventListener('load', ()=>{
        const gameArea = document.querySelector('.game-area');
        const centerX = (gameArea.offsetWidth / 2) - 25;
        clawPosition = { x: centerX, y: 0 };
        clawContainer.style.left = clawPosition.x + 'px';
        clawContainer.style.top = clawPosition.y + 'px';
    });

    setInterval(()=>{
        const prizes = document.querySelectorAll('.prize:not(.grabbed)');
        prizes.forEach((prize, index)=>{
            const currentBottom = parseInt(prize.style.bottom) || 80;
            const wobble = Math.sin(Date.now() * 0.002 + index) * 3;
            prize.style.bottom = (currentBottom + wobble) + 'px';
            const rotation = Math.sin(Date.now() * 0.001 + index) * 5;
            prize.style.transform = `rotate(${rotation}deg)`;
        });
    }, 50);
</script>
</body>
</html>
